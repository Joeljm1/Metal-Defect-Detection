# Model Ablation Variant M4: Proposed Integrated Architecture
# Description: Full proposed system combining CLAHE/Bilateral preprocessing and ECA/Spatial Attention.

model:
  name: "M4_Proposed_Integrated"
  architecture: "yolov5s_integrated"
  num_classes: 6
  in_channels: 3
  
  preprocessing:
    use_clahe: true
    use_bilateral: true
    clahe_clip_limit: 2.0
    clahe_tile_grid: [8, 8]
    bilateral_d: 5
    bilateral_sigma_color: 50.0
    bilateral_sigma_space: 50.0
    
  attention:
    use_eca: true
    use_spatial: true
    eca_gamma: 2
    eca_b: 1
    spatial_kernel_size: 7
    
  anchors:
    - [[29, 38], [34, 76], [79, 56]]       # P3/8 (small / compact defects)
    - [[33, 185], [57, 122], [178, 51]]    # P4/16 (elongated scratches / horizontal scale)
    - [[127, 80], [95, 182], [179, 186]]  # P5/32 (large defect clusters & patches)

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0005
  optimizer: "AdamW"
  lr_scheduler: "cosine"
